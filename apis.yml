aid: australian-business-register

name: Australian Business Register

description: 'The Australian Business Register (ABR), administered within the Australian Taxation Office (ATO), holds the
  publicly available information businesses provide when they register for an Australian Business Number (ABN). It exposes
  that data through ABN Lookup (abr.business.gov.au), hosted by the Department of Industry, Science and Resources, including
  free ABN Lookup web services: a SOAP/XML service (ABRXMLSearch, with WSDL) and JSON services for searching by ABN, ACN,
  name and postcode, available to registered users who accept the Web Services Agreement and obtain a GUID.'


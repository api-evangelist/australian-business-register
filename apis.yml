apis:
- aid: australian-business-register:abn-lookup-xml-search-web-service
  name: ABN Lookup XML Search Web Service (ABRXMLSearch)
  description: SOAP/XML web service for ABN Lookup that searches the Australian Business Register by ABN, ACN/ASIC number,
    name, postcode, charity, ABN status and registration/update events. It is free to registered users who accept the
    Web Services Agreement and pass an authentication GUID. The provider-hosted WSDL (28 operations) is saved verbatim.
  humanURL: https://abr.business.gov.au/Documentation/WebServiceMethods
  baseURL: https://abr.business.gov.au/abrxmlsearch/AbrXmlSearch.asmx
  tags:
  - ABN
  - SOAP
  - Business Registry
  properties:
  - type: WSDL
    url: wsdl/australian-business-register-abrxmlsearch.wsdl
  - type: WSDL
    name: WSDL (provider-hosted)
    url: https://abr.business.gov.au/abrxmlsearch/AbrXmlSearch.asmx?WSDL
  - type: Documentation
    url: https://abr.business.gov.au/Documentation/WebServiceMethods
- aid: australian-business-register:abn-lookup-xml-search-rpc-web-service
  name: ABN Lookup XML Search Web Service, RPC (ABRXMLSearchRPC)
  description: RPC-style variant of the ABN Lookup SOAP web service, linked from the ABN Lookup web services methods page.
    It exposes the same search operations (27, without SearchByABNv202001). The provider-hosted WSDL is saved verbatim.
  humanURL: https://abr.business.gov.au/Documentation/WebServiceMethods
  baseURL: https://abr.business.gov.au/abrxmlsearchRPC/AbrXmlSearch.asmx
  tags:
  - ABN
  - SOAP
  properties:
  - type: WSDL
    url: wsdl/australian-business-register-abrxmlsearch-rpc.wsdl
  - type: WSDL
    name: WSDL (provider-hosted)
    url: https://abr.business.gov.au/abrxmlsearchRPC/AbrXmlSearch.asmx?WSDL
- aid: australian-business-register:abn-lookup-json-services
  name: ABN Lookup JSON Services
  description: JSONP services for ABN Lookup (AbnDetails.aspx, AcnDetails.aspx, MatchingNames.aspx) that take a callback
    and the registered user's GUID. No machine-readable contract is published for the JSON services.
  humanURL: https://abr.business.gov.au/json/
  baseURL: https://abr.business.gov.au/json/
  tags:
  - ABN
  - JSON
  properties:
  - type: Documentation
    url: https://abr.business.gov.au/json/


generated: '2026-10-22'
method: searched
source: https://abr.business.gov.au/Documentation/Exceptions
format: soap-xml-exception
envelope:
  fields:
  - exceptionCode
  - exceptionDescription
  note: If an Application error occurs, the payload will contain an exception consisting of an exceptionCode and an exceptionDescription.
http_errors:
- Page not found (404)
- Internal server error (500)
note: Application errors come back inside the normal response payload, not as HTTP status codes. The status 200 on each row
  is our reading of that, because the docs give no HTTP status for application errors. The codes are category labels (SEARCH,
  WEBSERVICES), and the description text is the distinguishing value.
